apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-karpenter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-karpenter
  template:
    metadata:
      labels:
        app: nginx-karpenter
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-karpenter
spec:
  selector:
    app: nginx-karpenter
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
